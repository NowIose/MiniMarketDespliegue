{% extends "base.html" %}
{% block content %}
  <div class="container mt-4 text-center">
    <h3>Pago por QR</h3>
    <p>Total: <strong>{{ total }} Bs</strong></p>

    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR" style="max-width:300px;">

    <p class="mt-3">
      <a class="btn btn-primary" href="{% url 'descargar_pdf_qr' %}">Descargar PDF con QR</a>
    </p>

    <p class="text-muted mt-2">Escanea con tu app bancaria o billetera para pagar.</p>
  </div>
{% endblock %}
