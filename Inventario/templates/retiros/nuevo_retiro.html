{% extends "base.html" %}
{% load static %}

{% block title %}Nuevo Retiro{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">➕ Registrar Nuevo Retiro</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="producto" class="form-label">Producto</label>
                    <select name="producto" id="producto" class="form-select" required>
                        <option value="">Seleccione un producto...</option>
                        {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }} (Stock: {{ p.cantidad }})</option>
                        {% endfor %}
                    </select>
                    <div class="invalid-feedback">Debe seleccionar un producto válido.</div>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad a retirar</label>
                    <input type="number" step="0.01" min="0.01" name="cantidad" id="cantidad" class="form-control" required>
                    <div class="invalid-feedback">Ingrese una cantidad válida.</div>
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo del retiro</label>
                    <input type="text" name="motivo" id="motivo" class="form-control" maxlength="100" required>
                    <div class="invalid-feedback">Ingrese un motivo.</div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary px-4">💾 Guardar Retiro</button>
                    <a href="{% url 'inventario:lista_retiros' %}" class="btn btn-outline-secondary px-4">↩️ Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS validation -->
<script>
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
{% endblock %}
