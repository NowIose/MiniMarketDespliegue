{% extends "base.html" %}
{% block title %}Nuevo Suministro{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="text-center mb-4">📦 Registrar Nuevo Suministro</h2>

  <form method="POST" class="card shadow p-4">
    {% csrf_token %}

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Proveedor</label>
        <select name="proveedor" class="form-select" required>
          <option value="">Seleccione un proveedor...</option>
          {% for p in proveedores %}
            <option value="{{ p.id }}">{{ p.nombre_empresa }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Fecha de compra</label>
        <input type="date" name="fecha_com" class="form-control" value="{{ fecha_hoy }}" required>
      </div>
    </div>

    <hr>
    <h5>🧾 Detalles del suministro</h5>

    <div id="productos-container">
      <div class="producto-item row g-2 align-items-end mb-2">
        <div class="col-md-4">
          <label class="form-label">Producto</label>
          <select name="producto" class="form-select" required>
            <option value="">Seleccione...</option>
            {% for pr in productos %}
              <option value="{{ pr.id }}">{{ pr.nombre }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Cantidad</label>
          <input type="number" step="0.01" name="cantidad" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Precio compra</label>
          <input type="number" step="0.01" name="precio_com" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha vencimiento</label>
          <input type="date" name="fecha_ven" class="form-control" required>
        </div>
      </div>
    </div>

    <div class="text-end">
      <button type="button" id="add-product" class="btn btn-outline-primary btn-sm mt-2">➕ Agregar producto</button>
    </div>

    <hr>
    <div class="text-center mt-3">
      <button type="submit" class="btn btn-success px-5">💾 Guardar Suministro</button>
      <a href="{% url 'listar_categorias' %}" class="btn btn-secondary px-4">↩ Cancelar</a>
    </div>
  </form>
</div>

<script>
  document.getElementById('add-product').addEventListener('click', function() {
    const container = document.getElementById('productos-container');
    const item = container.querySelector('.producto-item');
    const clone = item.cloneNode(true);
    clone.querySelectorAll('input, select').forEach(el => el.value = '');
    container.appendChild(clone);
  });
</script>
{% endblock %}
